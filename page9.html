<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       
.page9 {
    width: 100%;
    min-height: 100vh;
    background: #16001f;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
    overflow: hidden;
}

.message-box {
    width: min(750px, 80%);
    padding: 65px 45px;

    background: #fffaf5;
    border-radius: 18px;

    text-align: center;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        0 0 35px rgba(255, 255, 255, 0.08);

    animation: messageAppear 1.2s ease;
}

.message-box h1 {
    margin: 0;

    color: #28182e;
    font-family: Georgia, serif;

    font-size: 48px;
    font-weight: 600;
    letter-spacing: 1px;

    line-height: 1.3;
}

@keyframes messageAppear {
    from {
        opacity: 0;
        transform: scale(0.85);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@media (max-width: 600px) {

    .message-box {
        padding: 45px 25px;
    }

    .message-box h1 {
        font-size: 32px;
    }
}


.page9-buttons {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    gap: 20px;
}

.page9-buttons button {
    padding: 12px 32px;

    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 30px;

    background: rgba(255, 255, 255, 0.12);
    color: white;

    font-size: 16px;
    cursor: pointer;

    backdrop-filter: blur(8px);

    transition: 0.3s ease;
}

.page9-buttons button:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: scale(1.08);
}


    </style>
</head>
<body>
   
<div class="page9">

    <div class="message-box">
        <h1>HAD MA YHEMU GHOFAYAAA ❤️😂</h1>
    </div>

</div>

    <div class="page9-buttons"> 
            <button onclick="window.location.href='page8.html'">
                Back 
            </button> 
            <button onclick="window.location.href='index.html'">
                Repeat
            </button> 
    </div>
</body>
</html>
