<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Your Gift</title>
    <link rel="stylesheet" href="style.css">
    <style>
body {
    min-height: 100vh;
    background: #160d24;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Animated violet background */
body::before {
    content: "";
    position: fixed;
    width: 600px;
    height: 600px;
    background: radial-gradient(
        circle,
        rgba(140, 70, 220, 0.25),
        transparent 70%
    );
    top: -200px;
    left: -150px;
    animation: moveGlow 8s ease-in-out infinite alternate;
}
h1 { font-size: 32px; letter-spacing: 6px; margin-bottom: 20px; opacity: 0; animation: fadeUp 1s ease 0.8s forwards; }
body::after {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: radial-gradient(
        circle,
        rgba(190, 80, 255, 0.18),
        transparent 70%
    );
    bottom: -200px;
    right: -150px;
    animation: moveGlow2 10s ease-in-out infinite alternate;
}

.warning-icon {
    font-size: 45px;
    margin-bottom: 10px;
    animation: heartbeat 1.5s infinite;
}
.warning-text { font-size: 18px; color: #dddddd; margin-bottom: 12px; opacity: 0; animation: fadeUp 1s ease 1.2s forwards; }
.warning-subtext { font-size: 14px; color: #999; margin-bottom: 35px; opacity: 0; animation: fadeUp 1s ease 1.6s forwards; }
h1 {
    font-size: 32px;
    letter-spacing: 6px;
    margin-bottom: 20px;
}
@keyframes boxAppear { from { opacity: 0; transform: scale(0.92) translateY(25px); } to { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.15);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.1);
    }

    60% {
        transform: scale(1);
    }
}
        @keyframes buttonGlow 
        { 
        0% { left: -100%; } 
        50% { left: 130%; } 
        100% { left: 130%; } 
    }
    @keyframes buttonAppear {
         from { opacity: 0; transform: translateY(20px) scale(0.9); } 
        to { opacity: 1; transform: translateY(0) scale(1); } 
    }
@keyframes moveGlow {
    from {
        transform: translate(0, 0);
    }

    to {
        transform: translate(250px, 180px);
    }
}
@keyframes moveGlow2 {
    from {
        transform: translate(0, 0);
    }

    to {
        transform: translate(-200px, -150px);
    }
}
#continue-button { position: relative; padding: 15px 38px; background: rgba(150, 70, 220, 0.12); color: white; border: 1px solid rgba(200, 140, 255, 0.6); border-radius: 50px; font-size: 15px; letter-spacing: 1px; cursor: pointer; overflow: hidden; opacity: 0; animation: buttonAppear 1s ease 2s forwards; transition: 0.4s ease; }
#continue-button::before { content: ""; position: absolute; top: 0; left: -100%; width: 70%; height: 100%; background: linear-gradient( 90deg, transparent, rgba(255, 255, 255, 0.25), transparent ); transform: skewX(-20deg); animation: buttonGlow 3s infinite; }
#continue-button:hover { transform: translateY(-4px) scale(1.03); background: rgba(170, 90, 240, 0.25); box-shadow: 0 0 20px rgba(180, 100, 255, 0.35), 0 0 50px rgba(150, 70, 220, 0.15); }
#continue-button {
    position: relative;
    z-index: 9999;
    display: inline-block;
    pointer-events: auto;
    touch-action: manipulation;
    cursor: pointer;
}   
    </style>
</head>
<body>
    <main class="page">

        <section class="warning-box">

            <div class="warning-icon">❤️</div>

            <h1>WARNING</h1>

            <p class="warning-text">
                This gift is protected.
            </p>

            <p class="warning-subtext">
                Please continue to the next page to access it.
            </p>

            <a href="page2.html" id="continue-button">
                Continue →
            </a>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
