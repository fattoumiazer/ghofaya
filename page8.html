<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
.page8 {
    width: 100%;
    min-height: 100vh;
    background: #16001f;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
    overflow: hidden;
}

.gift-box {
    width: min(600px, 80%);
    padding: 55px 45px;

    background: #fffaf5;
    border-radius: 18px;

    text-align: center;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        0 0 35px rgba(255, 255, 255, 0.08);

    animation: boxAppear 1.2s ease;
}

.gift-box h1 {
    color: #28182e;
    font-family: Georgia, serif;
    font-size: 28px;
    font-weight: 500;
    line-height: 1.5;

    margin: 0 0 20px;
}

.gift-box p {
    color: #5b405d;
    font-family: Georgia, serif;
    font-size: 18px;
    line-height: 1.7;

    margin-bottom: 35px;
}

.choices {
    display: flex;
    justify-content: center;
    gap: 25px;
}

.choice {
    min-width: 110px;
    padding: 13px 25px;

    border: 2px solid #7b3f72;
    border-radius: 50px;

    background: transparent;
    color: #7b3f72;

    font-size: 16px;
    cursor: pointer;

    transition: 0.35s ease;
}

.choice:hover {
    background: #7b3f72;
    color: white;
    transform: scale(1.08);
    box-shadow: 0 8px 20px rgba(123, 63, 114, 0.3);
}

@keyframes boxAppear {
    from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@media (max-width: 600px) {

    .gift-box {
        padding: 40px 25px;
    }

    .gift-box h1 {
        font-size: 23px;
    }

    .gift-box p {
        font-size: 16px;
    }

    .choices {
        gap: 12px;
    }
}


    </style>
</head>
<body>
    
<div class="page8">

    <div class="gift-box">

        <h1>Nchllh ykun 3ejbek el cadeau el sghir hetha ❤️</h1>

        <p>
            Ama 9bal ma nkamlou... 3andi sou2el sghir lik 💜
        </p>

        
        <div class="choices">

            <button class="choice" onclick="window.location.href='page9.html'">
                3ejbek
            </button>

            <button class="choice" onclick="window.location.href='page9.html'">
                Non
            </button>

        </div>


    </div>

</div>


</body>
</html>
