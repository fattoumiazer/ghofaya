<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=*, initial-scale=1.0">
    <title>Document</title>
    <style>
        
body {
    margin: 0;
    min-height: 100vh;
    background: #17001f;
    overflow: hidden;
}

.gallery {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 70px;
}

.photo-box {
    width: 600px;
    height: 750px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.photo-box img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 18px;
    cursor: zoom-in;
    transition: transform 0.3s ease;
}

.photo-box img:hover {
    transform: scale(1.02);
}

.arrow {
    width: 65px;
    height: 65px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    color: white;
    font-size: 32px;
    cursor: pointer;
    transition: 0.3s;
}

.arrow:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.1);
}

.zoom {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 0, 15, 0.95);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}

.zoom img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
}

.close {
    position: absolute;
    top: 20px;
    right: 30px;
    background: none;
    border: none;
    color: white;
    font-size: 55px;
    cursor: pointer;
}


h1 {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    text-align: center;

    color: #ffffff;
    font-size: 24px;
    font-weight: 500;

    z-index: 10;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
}


.continue-btn {
    position: relative;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);

    padding: 14px 42px;
    border: 2px solid rgba(255, 255, 255, 0.7);
    border-radius: 50px;

    background: rgba(255, 255, 255, 0.12);
    color: white;

    font-size: 18px;
    font-weight: 500;
    letter-spacing: 1px;

    cursor: pointer;

    backdrop-filter: blur(8px);

    animation: continueFloat 2.5s ease-in-out infinite;
    transition: all 0.3s ease;
}

.continue-btn:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateX(-50%) scale(1.08);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
}

@keyframes continueFloat {
    0%, 100% {
        transform: translateX(-50%) translateY(0);
    }

    50% {
        transform: translateX(-50%) translateY(-7px);
    }
}


    </style>
</head>
<body>
    
<h1>
    On your birthday I wanted to show you the best messages we’ve ever shared the ones I’ve kept in my heart and still remember to this day ❤️

</h1>

<div class="gallery">

    <button class="arrow" onclick="changePhoto(-1)">❮</button>

    <div class="photo-box">
        <img id="photo" src="photo1.jpg" onclick="zoomPhoto()">
    </div>

    <button class="arrow" onclick="changePhoto(1)">❯</button>

</div>

<div id="zoomBox" onclick="closeZoom()">
    <span>×</span>
    <img id="zoomedPhoto">
</div>

<script>
let currentPhoto = 1;

function changePhoto(direction) {

    currentPhoto = currentPhoto + direction;

    if (currentPhoto > 20) {
        currentPhoto = 1;
    }

    if (currentPhoto < 1) {
        currentPhoto = 20;
    }

    document.getElementById("photo").src =
        "photo" + currentPhoto + ".jpg";
}

function zoomPhoto() {
    document.getElementById("zoomedPhoto").src =
        "photo" + currentPhoto + ".jpg";

    document.getElementById("zoomBox").style.display = "flex";
}

function closeZoom() {
    document.getElementById("zoomBox").style.display = "none";
}
</script>

<button class="continue-btn" onclick="window.location.href='page7.html'">
    Continue
</button>


</body>
</html>
